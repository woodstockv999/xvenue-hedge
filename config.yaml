# xvenue-hedge: txflow BTC × perpl BTC クロス会場デルタ中立farm(2026-07-23)
# 狙い: txflowでBTCをfarm(将来pt)しつつperplで逆BTCをヘッジ=デルタ中立・両会場で二重farm。
# 効率値(出来高÷損失)は本botの台帳(data/cycles.jsonl)で独立計測する。
# ★dry_run/enabledは安全側の既定。実弾化は dry_run:false へ明示変更(dry_runで1サイクル完走確認後)。

dry_run: false          # true=発注せず両会場の板から約定を模擬(構造+台帳の検証)
enabled: true

symbol: "BTC"          # 対象資産(両会場共通)。案④(薄銘柄でtxflow maker化)は確定ネガ2026-07-24=HYPE/ZECともperpl側ワイドspreadの価格損(-15bps)がtxflow maker節約(-3bps)に必ず負ける(会場間流動性の反転)→BTC復帰。BTCはperpl spread0.03bpsでレース無し・basis≈0で価格ヘッジほぼ完全。perpl BTC=market1、txflow BTC=coin1
notional_usd: 150      # ①スケール2026-07-24: 100→150(perpl free$153実測・$150/3x=$50 free内)。xvenue perpl脚(効率9,636)の出来高を+50%=perpl会場ブレンドの9,636成分を成長。txflow$107/3x=$50内。★pair_hedgeと共有perpl口座=同時保有ピークを要監視
                       # ★3脚化(C5)では **txflow 脚のサイズ**として使う。lead は lead_notional_usd。

# ================= 3脚構成(2026-07-27 C5) =================
# perpl BTC を txflow より大きく建て、差分を perpl ETH で相殺する:
#     perpl BTC  +lead        txflow BTC -txflow_notional  → BTC net = lead - txflow
#     perpl ETH  -(その残差)                                → ETH で中立化
# = 旧 xvenue(BTC↔txflow BTC) と 旧 pair_hedge(BTC↔ETH) を **perpl 建玉1本**に統合した形。
# 狙い: perpl は BTC の板が圧倒的に厚い(spread 0.015bps / ETH 0.052 / SOL 0.132)のに、
#   BTC を使えるセルは実質1つ。pair_hedge を SOL に追いやった結果 効率 8,254→5,242 に落ちていた。
#   統合すれば両方の役割が BTC の板の上で回る。加えて ETH 脚は**失敗してもサイクルを殺さない**
#   ので、pair_hedge の損失源だった abort(片脚 46.9%)が設計上消える。
# ★2026-07-29: txflow 脚を退役。false で txflow に一切発注しない。
#   経緯: 07-29 02:20 に txflow equity $54.89 < 床$55 で自己ハルト(4.8時間停止)。
#   txflow は出来高の40%を出しながら**損失の77%**($-83 生涯)を負担しており、
#   出来高を1.8倍にした結果 16時間で $75.28 → $54.89 まで焼けた。入金しない方針なので退役。
#   残るのは **perpl BTC + perpl ETH** = 2026-07-22 に効率 **8,978** を出した構成そのもの
#   (当時の pair_hedge。BTC を xvenue に譲って SOL に落ちてから 3,659 まで劣化していた)。
#   ★txflow 名目が 0 になると _plan_sizes の残差 = lead 全額 → ETH が lead を丸ごとヘッジする。
#   ★txflow_min_equity_usd の床も自動で無効化する(発注しない口座の残高で永久ハルトするため)。
txflow_leg_enabled: false
hedge_leg_enabled: true    # false で ETH 脚を構築しない=**現行2脚と厳密に等価**(kill switch)
hedge_symbol: "ETH"        # perpl のヘッジ脚。_PERPL_MARKETS に定義が要る
# ★カナリア: lead を段階的に上げる。lead == notional_usd のとき残差0=ETH脚が構造的に不在。
#   証拠金 = (lead + 残差) / 3x。perpl equity $152.65 に対する余裕で刻む。
#   190 → perpl notional $230 / 証拠金 $77 / 余裕 $76   ← 今ここ
#   224 → $298 / $99  … perpl 出来高が pair_hedge 込みの現行水準に並ぶ
#   235 → $320 / $107 … 実用上限(runway 1.7日)
#   280 → $411 / $137 … 目標だが床$140まで runway 0.5日で**資本が足りない**
lead_notional_usd: 190
hedge_ratio: 1.00          # ETH 脚の名目倍率。gross 固定の分散最小比率は 180/300/600s とも
                           # ほぼ 1.0(実測: 0.978/0.987/1.024)。1800s まで伸ばすなら 1.10 へ再校正。
                           # ★pair_hedge の 1.21 は逆回帰の逆数を使った方法論エラーだった。
perpl_hedge_timeout_seconds: 45   # ETH follow の **maker 試行**の猶予。ここで刺さらなければ taker。
                           # ★2026-07-28 22:55 に 90→45 へ**差し戻し**。90 は「サイクル時間ゼロコスト」
                           #   だったが**裸窓のコストを数えていなかった**: ETH follow 中は残差 $40 が
                           #   無ヘッジで、45→90s は露出 1,800 $·秒 の増加(txflow 6→12s の 1,140 より大きい)。
                           #   実測でも ETH 2.37→1.53bps の節約($0.0062)を上回る価格悪化が出た。
                           # (以下は 90 にしたときの根拠。棄却済み)
                           # 旧案 45→90(= hold_seconds): **サイクル時間はゼロコスト**。
                           #   hold_end は ETH follow より先に確定するので、ETH の試行は hold 窓の
                           #   *内側*で走る。90s まで伸ばしても gap は変わらず、減るのは hold 残り
                           #   (=OI)だけ。効率優先の方針なので OI は許容する。
                           #   狙い: ETH の **open は 64% が taker**(実測 fee 2.36bps。maker 0.45 /
                           #   taker 3.45 bps-of-volume の混合から逆算)。手数料の 17.4% を占める。
                           #   猶予 120s のときの maker 率は 58% だったので、90s なら ~52% を見込む。
                           # ★perpl ETH の板は **1tick 幅**(実測)なので、txflow で効いた
                           #   「板の内側に置く」(follow_join_offset_ticks)は使えない。時間で稼ぐしかない。
                           # 旧: 45(hold 短縮に合わせて lead と揃えたが、hold 窓の内側で走ることを
                           #     見落としており、縮める必要が無かった)。
                           # 代償: maker 約定率が下がり taker 比率が上がる(t120 で 58%)。1件 $0.023 なので
                           #   全件 taker でも $0.023×18cycle/h×24 = $9.9/日。gap 415→~200s の
                           #   net +2$/h(=+$48/日)に対して十分小さい。
perpl_hedge_taker_fallback_ab: [false, true]
                           # ★A/B 稼働中(2026-07-29 開始)。空 [] で下の固定値に戻る。
                           # 経緯: 下の「$190 では taker が高すぎる」という試算で false にしたが、
                           #   実際に走らせると **ETH が maker で埋まらず 2leg_eth_abort が連発**し、
                           #   出来高が $765→$383 に半減した。試算が見落としていたのは
                           #   「maker で粘れば埋まる」ではなく「サイクルが丸ごと消える」こと。
                           #   abort は手数料は安いが lead $190 を裸で持つ方向賭けになる
                           #   ([[pair-hedge-loss-anatomy-2026-07-22]] 損失の71%が価格・その71%がabort)。
                           # 手数料(taker ONが不利)と価格(abortが不利)の綱引きなので机上で決まらない。
                           #   周回パリティで振って `scripts/ab_hedge_taker.py` で判定する。
                           # ★判定は効率値そのもの。腕によって1サイクルの出来高が倍違うので、
                           #   join offset A/B のような「率で判定」は今回は使えない。
perpl_hedge_taker_fallback: false # ★2026-07-29 に true→false(txflow 退役に連動)。
                           # 理由: ETH が hedge する対象が **残差$40 → lead 全額$190** に変わった。
                           #   $40 なら taker 6.9bps = $0.023/cycle で「hold を守る方が得」だったが、
                           #   $190 では $0.131/cycle になり、**効率が今より落ちる**(試算 5,430 < 現行 6,213)。
                           # 07-22 に効率 8,978 を出した構成は「両脚 maker・駄目なら見送り」だった。
                           #   見送りは hold に入らず即クローズするので裸保持は発生しない(安全)。
                           # ★false でも abort コストは台帳に載る(2026-07-29 に _perpl_hedge_follow を
                           #   keep_partial=True 固定にして自分で畳むようにした)。true 時代に塞いだ穴を
                           #   再発させないため。
                           # 旧: true — ★2026-07-28: maker で埋まらなかった残りを taker(6.9bps)で埋め、
                           # ヘッジ脚を**必ず完成させる**。false で従来動作(不成立なら全畳み)。
                           # 根拠: maker 一本槍だと ETH follow が 40%(49/122)不成立で、その全部が
                           #   hold に入らず即クローズ = 狙っている OI が4割の周回で丸ごと消えていた。
                           #   内訳 = 部分約定(ほぼ 0.001/0.02 = 5%)を grace 5s で見切って畳む 23 件、
                           #   素の timeout 26 件。
                           # コスト: ヘッジ対象は lead-txflow の**残差$40だけ**なので maker→taker の
                           #   6bps 差は **$0.023/cycle**。maker で粘って節約できるのは2.3セント、
                           #   失うのは1サイクルぶんの hold(=OI)。割に合わない。
                           # ★この経路の導入前は、部分約定→unwind のコストが台帳にも口座ガードにも
                           #   1ドルも現れていなかった(全サイクルの40%)。role="hedge_abort" 脚で計上する。
hold_seconds: 90       # ★2026-07-28: 300→90 に**差し戻し**(ユーザー判断で OI 優先 → 効率/net 優先へ再転換)。
                       # 実測(3脚 n=77 / abort枝 n=50、07-27〜28):
                       #   hold300: gap 415s 出来高 6,546$/h 現金 -1.32$/h pt@$5 +3.27 → net **+1.96$/h**
                       #   hold~0 : gap 212s 出来高11,425$/h 現金 -2.06$/h pt@$5 +5.71 → net **+3.65$/h**
                       #   ★どの pt 単価($5/$3.94/$2.04)でも短い方が net で勝つ。
                       # ★**効率値は hold で動かない**(下の「価格損は hold 非依存」の通り、出来高も
                       #   損失も同率で増減する)。これは net/時間 のための変更であって効率の改善ではない。
                       #   効率を動かすのは ETH 脚(限界効率 2,544 << セル 5,134)の有無 = hedge_leg_enabled。
                       # ★perpl_hedge_timeout_seconds を 45 に**連動させないと効かない**: hold_end は
                       #   ETH follow より先に確定するので、hold(90) < ETH猶予(120) だと ETH follow が
                       #   サイクル長を支配して gap が縮まない。
                       # 旧コメント(300 にした 07-27 Step1 の根拠)は以下に保存:
                       # ・**OI と保有時間を積むための延長**(方針転換)。
                       # 昨今のエアドロは出来高だけでなく PnL と OI も見るという判断で、評価軸が
                       # 「出来高あたりの効率」から「建玉を持っている時間の総和」に変わった。
                       # 実測の根拠:
                       #   ・TWA OI = notional × hold/gap、gap = 103.3 + 1.067×hold(実測フィット)
                       #     → hold 90 で OI $67.7 → hold 300 で $106.3 → hold 600 で $121.0
                       #   ・**平均価格損は hold に依存しない**(hold45 -1.133bps vs hold90 -1.265bps、
                       #     t=+0.21)。損失は約定時点の固定コスト(逆選択)で保有中の蓄積ではない
                       #     → 効率(出来高÷損失)は hold 不変。出来高もコストも同率で減るだけ。
                       #   ・perpl BTC の funding.rate = 0(funding_interval 3600s)なので
                       #     長時間保有のキャリーコストはゼロ。
                       #   ・出来高が減る分 **損失も比例して減る** = runway が伸びる(入金しない方針)。
                       # ★出来高/OI 比は mPoints の唯一の定量的 inorganic 定義 min(ADV, OI×10) に対し
                       #   実測 1,920x(perpl 全体は 8.1x)。hold 延長はこの比を直接改善する。
                       # 旧: 90。8500狙い②(hold60)は棄却(2026-07-24)だが、あれは**効率**を目標に
                       # した判定で、OI を目的にする現方針とは評価軸が違う。次は 600 を予定(Step2)。
cooldown_seconds: 30    # サイクル間クールダウン。429対策済みで30→15へ短縮(throughput↑)
skip_cooldown_seconds: 5   # 2026-07-25追加: **見送り時**のクールダウン(建玉を取っていないので
                           # 冷やす対象が無い)。実測(07-25 12時以降): lead不成立率36.7%・見送り1回
                           # 中位81s のうち30sがcooldown → 完走あたり~17sの純待ち。5sにして throughput
                           # +約7%(16.1→17.3 cycles/h 試算)。連続見送りの429自己増幅は
                           # skip_streak_backoff_after(5連続)が別に受け持つので単発は短くて安全。
                           # ★perpl_lead_timeout_seconds の延長(45→90)は**採らなかった**: 見送りは
                           #   減るが requote_interval 12s のため1試行あたりのAPI操作が倍増し、
                           #   完走あたりの操作数は 6.3→9.2 と悪化=429を増やす方向。

# 改善①②(2026-07-23): perpl maker を先行(lead)させ patient に刺す + txflow を追従(follow)。
#   旧構成(txflow先行→perpl追従)は perpl taker落ち76%だった。逆転で perpl maker率↑、
#   追従が taker落ちしても安い txflow(4.5bps)<perpl(6.9bps)。
perpl_lead_timeout_seconds: 45   # perpl maker先行の猶予。45→30で不成立を早く見切り次サイクルへ(no_fill空振り時間短縮=完走/時↑)
requote_interval_seconds: 12      # perpl maker が touch から外れたら置き直す間隔(429回避で控えめ維持)
close_requote_seconds: 3          # txflow closeのmaker置き直し間隔。5→3で追随を速くしclose taker落ち21%削減(txflowは429無縁で回数増OK)
leg_timeout_seconds: 40          # closeのtxflow maker猶予。15→40(案①2026-07-24)=close taker落ち削減で実損減。close中はperpl脚が開いたまま(perpl closeはtxflow close後)=待機延長もヘッジ維持で裸窓は増えない。代償はサイクル時間微増(maker不成立時のみ)
# 追従(hedge)は即taker(2026-07-23)。IOCがtouchちょうどだと板移動で刺さらずhedge_fail→
# クロス方向に8bpsバッファ。IOCは板最良値で約定=バッファは約定保証のみでコスト増にならない。
taker_cross_bps: 8.0
# hybrid追従(2026-07-24): perpl裸窓中にtxflow makerを短時間試す→刺されば1.5bps(taker4.5より3bps安)。
# 刺さらなければtakerで裸窓を閉じる。裸窓が最大try秒に延びる代償でfee削減。
follow_maker_try_seconds: 6.0    # ★2026-07-28 22:55 に 12→6 へ**差し戻し**(下の12への変更は棄却)。
                           #   実測(n=25, 1.5h): 手数料は狙い通り下がった(txflow 2.18→1.95bps・
                           #   taker 40.8→28.0%)が、**価格損失が -0.0211→-0.0608/cyc と3倍**になり
                           #   効率 6,213→4,786。節約$0.0108 を価格悪化$0.0397 で買っていた。
                           # ★構造的な理由(join offset との決定的な違い):
                           #     join offset  = 「どこに置くか」→ 裸の時間は不変 → 価格はヘッジが相殺 → 無料
                           #     try/timeout  = 「どれだけ待つか」→ **裸の時間が延びる** → 相殺相手なし → 有料
                           #   txflow follow 中は perpl $190 が無ヘッジ。待つほど純粋な方向リスクを負う。
                           #   ★「手数料が下がるなら得」は、裸窓を延ばす施策には適用できない。
                           # (以下は 12 にしたときの根拠。棄却済みだが再挑戦するなら A/B で)
                           # 旧案 6→12: **手数料の 65.6% が txflow 脚**で、
                           #   open の 37% が taker(4.5bps)。ここが効率の最大レバー。
                           # ★8s 棄却(下記)を覆す根拠2つ:
                           #   (1) あの判定は **n=14 の前後比較**。txflow の taker 率は時間帯で
                           #       25〜75% 振れる(07-28 実測)ので、この n では符号すら決まらない
                           #       (実際 join offset は前後比較で効果が逆に出た)。
                           #   (2) 棄却理由「価格が寄らねば maker 不成立=窓延長は裸窓を延ばすだけ」は
                           #       **touch に並んでいた頃の力学**。今は follow_join_offset_ticks:1 で
                           #       板の内側=列の先頭にいるので、対向フローが来れば刺さる。
                           #       「待てば当たる」に変わったので、時間を伸ばす意味が生まれた。
                           # 代償: 裸窓(perpl $190 が無ヘッジ)が最大6秒延びる。価格成分は損失の
                           #   17% しかなく(手数料83%)、6秒の BTC σ は約1.7bps=$0.032 で期待値ゼロ。
                           # 旧: 6.0 — 案②2026-07-24: open maker試行窓。8sは実測で6sに劣後(taker_follow直近14=43%>直近25=32%・eff5738<6902、n=14ノイズ含むが押し上げ効果なし)→6sへ戻す。厚いtxflow BTC板の追従脚は価格が寄らねばmaker不成立=窓延長は裸窓を延ばすだけで最後taker
# ★2026-07-28: txflow follow の maker を **板の1tick内側**に置く(0=従来のtouch並び)。
#   実測: txflow BTC のスプレッドは 15/15 サンプルで常に 2tick(0.032bps)固定 = MM が張り付き。
#   touch に並ぶと bid 側の 0.09〜4.5 BTC の後ろに付く(自分は 0.0024 BTC)ので 6秒では刺さらず、
#   **open taker 落ち 47%**(07-24〜28 で 38.8/53.5/64.2/53.8/46.8%、n=990)。
#   1tick 内側ならスプレッドが 1tick になり、内側に入るには反対 touch を越えるしかない
#   = **無競争の最良気配**。対向フローに最初に当たる。
#     コスト 1tick=0.0158bps / 節約 taker回避=3.0bps → **190倍有利**
#   post_only 拒否時は touch へ落として粘る(いきなり taker にしない)。
#   ★リスク: キュー先頭は逆選択も最初に受ける。taker率と価格bpsの両方で判定すること。
follow_join_offset_ticks: 1
# ★A/B(2026-07-28): サイクルごとに交互に振る。空 [] で A/B 停止 → follow_join_offset_ticks を使う。
#   なぜ前後比較ではダメか: txflow の taker 率は**時間帯で 25〜75% 振れる**(07-28 時間別実測)。
#   投入直後 n=16 は 43.4%→68.8% と逆に出たが、投入時刻がもともと 75% の時間帯だった。
#   同一時間帯で交互に振らないと、この分散に効果が埋もれる。
#   集計は台帳の `join_offset_ab` 列を持つ行だけで行う。
# ★2026-07-28 17:10 に **A/B を打ち切って +1tick を採用**([] で固定値に戻す)。
#   n=61(31/30, 3.5h) 時点: taker 51.6% vs 43.3%(率差 8.3pp, z=+0.65)。有意ではないが、
#   taker率・手数料・net の**3指標すべてが同方向**(+1tick 有利)。
#   ★有意性で決めなかった理由 = 損得が極端に非対称だから:
#       効果ゼロだった場合の損失上限  $0.07/日  ← 1tick=0.0158bps しか払わない(構造的な上限)
#       率差8.3pp が本物なら          +$1.88/日
#       A/B を続ける費用              -$0.76/日 ← 半分のサイクルを劣る腕で回す
#     8.3pp を検出するには片腕570サイクル(2.5日)要る。**継続費用が誤りの費用の10倍**なので、
#     p<0.05 を待つのは意思決定として誤り。点推定が正なら採用でよい。
#   出来高は両腕とも $760/cycle で差なし = 出来高を犠牲にしていないことも確認済み。
#   post_only 拒否は 0件(クランプが効いている)。
#   ★再開する場合は [0, 1] に戻すだけ。台帳の `join_offset_ab` 列で腕が判別できる。
follow_join_offset_ab: []
follow_maker_requote_seconds: 1.5  # requote1.0(8500狙い)は棄却(2026-07-24): taker落ちは価格ドリブン(taker群price-$0.026 vs maker-$0.013=adverse-selection検出器・pair_hedge abortと同構造)でタイミングでは消せず、taker率32%→40-48%へ逆に上昇→既知ベスト1.5へ復帰
# 改善③: perplは共有IPのCF 1015制限=pair_hedgeと帯域競合。poll間隔を空けて429緩和。
poll_interval_seconds: 5          # fills RESTポーリング間隔。5s=45sリードで最大9回(旧3s=15回)

# 429緩和(2026-07-23): BBOはget_context(CF保護REST)を毎回叩く→短TTLキャッシュで畳む。
perpl_bbo_ttl_seconds: 2.0
# CF 1015(IPレート制限)検出時は即再突入せずエスカレート待機(バンを延ばさない)。clean cycleで解除。
partial_grace_seconds: 5       # 常駐WSは約定を即時に見るので「埋まりかけ」を部分約定と誤らないための様子見(2026-07-25)
skip_streak_backoff_after: 5   # 見送りが何連続したらバックオフを効かせるか(2026-07-25: 309連続見送りで6.5h停止した対策)
# ★見送りが何連続したら「常駐WS feed を信じない」か(2026-07-27追加)。
#   feed が消えた指値を返し続けると _pp_entry_blocked が永久に True を返して全サイクルを
#   見送る。実測で同一 oid が49連続検出され約3時間停止した(取引所側は指値ゼロ・建玉フラット)。
#   この回数を超えたら取引所に問い合わせ、空なら続行・残っていればその場で取消す。
#   小さすぎると余計な REST を焼くので、バックオフ発火(5)より手前の 3 にする。
feed_distrust_after_skips: 3
rl_backoff_base_seconds: 30
rl_backoff_cap_seconds: 240

# 撤退基準(2026-07-26 改定)。主役は **perpl 口座の合算ローリングガード**。
#
# ★07-25 の「効率が主役」は前提が壊れていた(2026-07-26 監査):
#   volume_usd は main.py で `notional * 4` = **2会場×(open+close)のブレンド**なのに、
#   pt率 10pt/$100k は **perpl 単独**の実測値(epoch6=10.14)。ブレンド出来高に perpl の率を
#   掛けていたので収入が正確に2倍過大で、真の分岐点は 4,902 ではなく **9,804**(k=1.39補正後 8,668)。
#   07-25 の「効率6,248でpt換算黒字$25.5」も再検算すると perpl 分の出来高は $61,952 しかなく
#   収入$12.64 vs 損失$20.03 = **赤字-$7.39**。あの loss_budget 発火は誤発火ではなく正しかった。
#   → 現行効率 5,843 は真の分岐点を大きく割る。効率で判定すれば即停止になる。
#
# ユーザー方針(2026-07-26): **txflow は効率値を考慮せず引き続き出来高を稼ぐ**。
#   txflow の将来 pt が perpl 同等以上の価値を持つ、という未検証の仮定に賭ける立場。
#   よって効率ゲートは無効化し、守るのは「口座が枯れないこと」だけにする。
#
# 実測の危険度(2026-07-26): perpl equity $186.24(initial $342.65 から -45.6%)。
#   直近24h の合算損失 -$43.59 = 残存の 23.4%/日 → 現金ベースで枯渇まで約4.3日。
#   perpl pt 収入($33.07/日)を全額数えても -$10.52/日。
#   かつ risk.dex_overrides.perpl.max_drawdown_pct が null なので**口座DDハルトが存在しない**。
account_guard_24h_usd: 40   # ★主役。両セルの**直近24h合算**損失がこれを超えたら停止。
                            # 実装は apps/hyperliquid-bot/src/perpl_account_guard.py(両セル共有)。
                            # ★2026-07-27: 60→40。ガード自体を「**perpl 脚だけ**を合算する」よう
                            #   修正した(C-3)ので、同じ実損でも数字が小さく出るようになった:
                            #   修正前 両会場ブレンド -$45.7 → 修正後 perpl脚のみ -$23.03
                            #   (pair_hedge -$15.12 + xvenue perpl脚 -$7.91)。
                            #   xvenue の txflow 側の損失は **txflow 口座**から出るので perpl の
                            #   equity を1セントも減らさない。それを perpl 口座のガードに混ぜて
                            #   いたのが誤りだった(txflow の損失で perpl 側が止まる/逆に perpl が
                            #   本当に減っていても検出が遅れる、の二重の誤り)。
                            #   閾値は perpl equity $163.84 − 床 $140 = 余裕 $23.84 を基準に、
                            #   hold 延長で burn が半減する見込みを織り込んで 40。
perpl_margin_utilization: 0.75
                            # ★2026-07-29新設。lead 名目を perpl equity から導く上限
                            #   (lead ≤ (equity × leverage × これ + txflow名目) / 2)。0 で無効。
                            # 経緯: txflow 退役で ETH のヘッジ対象が残差$40→lead全額$190 になり、
                            #   hold 中の必要証拠金が 2×190/3 = $126.7 vs equity $127.4 と
                            #   余裕$0.7 になった。**ETH の発注が全部 sr=44 で拒否され follow が
                            #   100% 不成立**、出来高が $765→$383 に半減した。
                            # ★口座が痩せると発注は「黙って拒否される」だけで、症状は出来高減しか
                            #   出ない。だから名目は固定値でなく equity から導く。
                            # 0.75 の内訳: 残り25%は手数料・含み損・マーク変動の緩衝。
perpl_equity_floor_usd: 85  # ★2026-07-27新設 → 同日 C4/C5 で再計算(140→85)。
                            # 床の根拠 = **同時に持つ全セルの必要証拠金**。pair_hedge 退役で
                            # perpl 側は xvenue だけになったため大きく下がった:
                            #   旧: xvenue BTC $150/3x=$50 + pair_hedge SOL $40 + ETH $48.4 ≒ $138.4
                            #   新: perpl BTC lead $190/3x=$63.3 + perpl ETH $40/3x=$13.3 ≒ $76.7
                            # 実測 equity $152.64 に対し余裕 $76。床を140のままにすると余裕が
                            # $12.6 しかなく、通常運転の損失で誤ハルトする。
                            # ★lead_notional_usd を上げたらここも再計算すること
                            #   (224→$99 / 235→$107 / 280→$137)。
                            # ここを割ると発注自体が通らなくなる(=farm が機能停止する)ので、
                            # その手前で明示的に止める。
                            # ★risk.dex_overrides.perpl.max_drawdown_pct(ピーク比)を使わないのは
                            #   **意図的**。perpl は出来高を買うために意図的に損を出すセルで equity は
                            #   設計上単調に下がるため、ピーク比の全凍結は「設計どおり動いているだけ」で
                            #   発火する(2026-07-17 に偽DD 19.6% で全凍結の$1.03手前まで行った実例。
                            #   src/risk.py の _dd_limit docstring)。絶対額の床ならその矛盾がない。
efficiency_floor: 0      # ★0=無効(2026-07-26)。上記の通り効率は本セルの撤退基準にしない。
                         # 効率で止めたくなったら真の分岐点 8,668〜9,804 を入れる
                         # (旧値 4,900 は次元の誤りで半分。戻すなら再導出すること)。
efficiency_min_volume_usd: 1000   # efficiency_floor が0の間は未使用。復帰時のために残置。
loss_budget_usd: 200    # セル累積net。バグ由来の暴走(想定外サイズ・脚放置の連鎖)にだけ効く
                        # 外側の弁。口座を守るのは上の account_guard_24h_usd。

# ★txflow 口座の証拠金下限(2026-07-27追加)。それまで main.py に balance 参照が1つも無く、
#   $26/日 燃やしている口座の残高を誰も見ていなかった(監査 C-5)。account_guard_24h_usd は
#   両セルの**セルnet**を合算するもので、口座残高そのものは perpl 側も txflow 側も未監視。
#   必要証拠金 = notional 150 / leverage 3 = $50 が床。実測 07-27 07:00 の equity は
#   $103.78(建玉フラット)なので、バッファを載せて 55 で止める。
txflow_min_equity_usd: 55
# hold 中に txflow 建玉の超過を確認する間隔(秒)。open 直後の1回きりのガードでは
# 取消×約定レースで数秒遅れて刺さる2本目を見逃していた(全ログで「建玉超過」発火0件)。
# hold を延ばす方針では露出時間がそのまま伸びるので、hold 中も定期確認して削る。
hold_position_check_seconds: 30

# 実測接地の手数料(bps)。txflow=cycles.jsonl逆算、perpl=exchange docstring。
fees:
  txflow_maker_bps: 1.5
  txflow_taker_bps: 4.5
  perpl_maker_bps: 0.9
  perpl_taker_bps: 6.9
  perpl_close_bps: 0.0   # reduce≈無料

# 実弾初回は1サイクルで停止(canary検証)。建玉フラット確認後にfalse。
canary_once: false
