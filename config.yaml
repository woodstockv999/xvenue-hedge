# xvenue-hedge: txflow BTC × perpl BTC クロス会場デルタ中立farm(2026-07-23)
# 狙い: txflowでBTCをfarm(将来pt)しつつperplで逆BTCをヘッジ=デルタ中立・両会場で二重farm。
# 効率値(出来高÷損失)は本botの台帳(data/cycles.jsonl)で独立計測する。
# ★dry_run/enabledは安全側の既定。実弾化は dry_run:false へ明示変更(dry_runで1サイクル完走確認後)。

dry_run: false          # true=発注せず両会場の板から約定を模擬(構造+台帳の検証)
enabled: true

symbol: "BTC"          # 対象資産(両会場共通)。案④(薄銘柄でtxflow maker化)は確定ネガ2026-07-24=HYPE/ZECともperpl側ワイドspreadの価格損(-15bps)がtxflow maker節約(-3bps)に必ず負ける(会場間流動性の反転)→BTC復帰。BTCはperpl spread0.03bpsでレース無し・basis≈0で価格ヘッジほぼ完全。perpl BTC=market1、txflow BTC=coin1
notional_usd: 150      # ①スケール2026-07-24: 100→150(perpl free$153実測・$150/3x=$50 free内)。xvenue perpl脚(効率9,636)の出来高を+50%=perpl会場ブレンドの9,636成分を成長。txflow$107/3x=$50内。★pair_hedgeと共有perpl口座=同時保有ピークを要監視
hold_seconds: 90       # 8500狙い②(hold60)は棄却(2026-07-24): priceはbasisノイズで窓依存(-$0.35〜-$0.69)・制御不能→既知ベスト90へ復帰
cooldown_seconds: 30    # サイクル間クールダウン。429対策済みで30→15へ短縮(throughput↑)

# 改善①②(2026-07-23): perpl maker を先行(lead)させ patient に刺す + txflow を追従(follow)。
#   旧構成(txflow先行→perpl追従)は perpl taker落ち76%だった。逆転で perpl maker率↑、
#   追従が taker落ちしても安い txflow(4.5bps)<perpl(6.9bps)。
perpl_lead_timeout_seconds: 45   # perpl maker先行の猶予。45→30で不成立を早く見切り次サイクルへ(no_fill空振り時間短縮=完走/時↑)
requote_interval_seconds: 12      # perpl maker が touch から外れたら置き直す間隔(429回避で控えめ維持)
close_requote_seconds: 3          # txflow closeのmaker置き直し間隔。5→3で追随を速くしclose taker落ち21%削減(txflowは429無縁で回数増OK)
leg_timeout_seconds: 40          # closeのtxflow maker猶予。15→40(案①2026-07-24)=close taker落ち削減で実損減。close中はperpl脚が開いたまま(perpl closeはtxflow close後)=待機延長もヘッジ維持で裸窓は増えない。代償はサイクル時間微増(maker不成立時のみ)
# 追従(hedge)は即taker(2026-07-23)。IOCがtouchちょうどだと板移動で刺さらずhedge_fail→
# クロス方向に8bpsバッファ。IOCは板最良値で約定=バッファは約定保証のみでコスト増にならない。
taker_cross_bps: 8.0
# hybrid追従(2026-07-24): perpl裸窓中にtxflow makerを短時間試す→刺されば1.5bps(taker4.5より3bps安)。
# 刺さらなければtakerで裸窓を閉じる。裸窓が最大try秒に延びる代償でfee削減。
follow_maker_try_seconds: 6.0    # 案②2026-07-24: open maker試行窓。8sは実測で6sに劣後(taker_follow直近14=43%>直近25=32%・eff5738<6902、n=14ノイズ含むが押し上げ効果なし)→6sへ戻す。厚いtxflow BTC板の追従脚は価格が寄らねばmaker不成立=窓延長は裸窓を延ばすだけで最後taker
follow_maker_requote_seconds: 1.5  # requote1.0(8500狙い)は棄却(2026-07-24): taker落ちは価格ドリブン(taker群price-$0.026 vs maker-$0.013=adverse-selection検出器・pair_hedge abortと同構造)でタイミングでは消せず、taker率32%→40-48%へ逆に上昇→既知ベスト1.5へ復帰
# 改善③: perplは共有IPのCF 1015制限=pair_hedgeと帯域競合。poll間隔を空けて429緩和。
poll_interval_seconds: 5          # fills RESTポーリング間隔。5s=45sリードで最大9回(旧3s=15回)

# 429緩和(2026-07-23): BBOはget_context(CF保護REST)を毎回叩く→短TTLキャッシュで畳む。
perpl_bbo_ttl_seconds: 2.0
# CF 1015(IPレート制限)検出時は即再突入せずエスカレート待機(バンを延ばさない)。clean cycleで解除。
partial_grace_seconds: 5       # 常駐WSは約定を即時に見るので「埋まりかけ」を部分約定と誤らないための様子見(2026-07-25)
skip_streak_backoff_after: 5   # 見送りが何連続したらバックオフを効かせるか(2026-07-25: 309連続見送りで6.5h停止した対策)
rl_backoff_base_seconds: 30
rl_backoff_cap_seconds: 240

loss_budget_usd: 20     # 台帳の累積net損失がこれを超えたら自己ハルト(発注停止)

# 実測接地の手数料(bps)。txflow=cycles.jsonl逆算、perpl=exchange docstring。
fees:
  txflow_maker_bps: 1.5
  txflow_taker_bps: 4.5
  perpl_maker_bps: 0.9
  perpl_taker_bps: 6.9
  perpl_close_bps: 0.0   # reduce≈無料

# 実弾初回は1サイクルで停止(canary検証)。建玉フラット確認後にfalse。
canary_once: false
